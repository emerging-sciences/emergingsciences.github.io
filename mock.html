<script>
/* ===== EDIT HERE: test settings ===== */
const CFG={title:'IIT JAM Mathematics (MA) — Mock Test 1',minutes:30,secs:{A:'Section A (MCQ)',B:'Section B (MSQ)',C:'Section C (NAT)'}};
/* Question format: s=section, t=MCQ|MSQ|NAT, m=marks, q=question, o=options, a=answer index list (MCQ/MSQ) or [min,max] (NAT), e=solution. Math: $...$ (use \\ for backslash) */
const Q=[
{s:'A',t:'MCQ',m:1,q:'The value of $\\displaystyle\\lim_{x\\to0}\\frac{\\sin x-x\\cos x}{x^{3}}$ is',o:['$1/6$','$1/3$','$1/2$','$1/12$'],a:[1],e:'$\\sin x=x-\\frac{x^3}{6}+\\dots$ and $x\\cos x=x-\\frac{x^3}{2}+\\dots$, so the numerator behaves like $\\frac{x^3}{3}$.'},
{s:'A',t:'MCQ',m:1,q:'Which of the following series converges?',o:['$\\sum_{n\\ge2}\\frac{1}{n\\ln n}$','$\\sum_{n\\ge1}\\frac{1}{\\sqrt n}$','$\\sum_{n\\ge2}\\frac{1}{n(\\ln n)^2}$','$\\sum_{n\\ge1}\\frac{n}{n+1}$'],a:[2],e:'Integral test: $\\int\\frac{dx}{x(\\ln x)^2}$ converges; the other three diverge.'},
{s:'A',t:'MCQ',m:2,q:'If $y^{\\prime}+y=e^{-x}$ and $y(0)=1$, then $y(1)$ equals',o:['$1/e$','$2/e$','$3/e$','$e$'],a:[1],e:'Integrating factor $e^x$: $(ye^x)^{\\prime}=1\\Rightarrow y=(x+1)e^{-x}$, so $y(1)=2/e$.'},
{s:'A',t:'MCQ',m:2,q:'Let $A$ be a $3\\times3$ real matrix with eigenvalues $1,2,3$. Then $\\det(A^{-1}+I)$ equals',o:['$2$','$4$','$6$','$8$'],a:[1],e:'Eigenvalues of $A^{-1}+I$ are $2,\\frac32,\\frac43$; their product is $4$.'},
{s:'A',t:'MCQ',m:2,q:'The number of elements of order $4$ in the group $\\mathbb Z_4\\times\\mathbb Z_4$ is',o:['$4$','$8$','$12$','$16$'],a:[2],e:'Elements of order dividing $2$ form $\\{0,2\\}^2$ (4 elements). Hence $16-4=12$.'},
{s:'B',t:'MSQ',m:2,q:'Which of the following subsets of $\\mathbb R$ are compact?',o:['$[0,1]\\cup\\{2\\}$','$\\mathbb Q\\cap[0,1]$','$\\{1/n:n\\ge1\\}\\cup\\{0\\}$','$(0,1]$'],a:[0,2],e:'Heine–Borel: closed and bounded. $\\mathbb Q\\cap[0,1]$ and $(0,1]$ are not closed.'},
{s:'B',t:'MSQ',m:2,q:'Let $A$ be a real $n\\times n$ matrix with $A^2=A$. Which of the following are TRUE?',o:['Every eigenvalue of $A$ is $0$ or $1$','$A$ is diagonalizable','$I-A$ is also idempotent','$A$ is invertible'],a:[0,1,2],e:'Minimal polynomial divides $x(x-1)$ (distinct roots), $(I-A)^2=I-A$. $A=0$ is not invertible.'},
{s:'B',t:'MSQ',m:2,q:'Which of the following functions are entire?',o:['$e^{z^2}$','$\\frac{1}{1+z^2}$','$|z|^2$','$z^3-3z+\\cos z$'],a:[0,3],e:'$\\frac1{1+z^2}$ has poles at $\\pm i$; $|z|^2$ fails the Cauchy–Riemann equations away from $0$.'},
{s:'C',t:'NAT',m:1,q:'The value of $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n(n+2)}$ is ______ (rounded to two decimal places).',a:[0.75,0.75],e:'$\\frac12\\left(\\frac1n-\\frac1{n+2}\\right)$ telescopes to $\\frac12\\left(1+\\frac12\\right)=0.75$.'},
{s:'C',t:'NAT',m:1,q:'The rank of the matrix $\\begin{pmatrix}1&2&3\\\\2&4&6\\\\1&0&1\\end{pmatrix}$ is ______.',a:[2,2],e:'Row 2 = 2 × Row 1, while Rows 1 and 3 are independent. Rank $=2$.'},
{s:'C',t:'NAT',m:2,q:'Let $y^{\\prime\\prime}-3y^{\\prime}+2y=0$, $y(0)=0$, $y^{\\prime}(0)=1$. Then $y(\\ln 2)=$ ______.',a:[2,2],e:'$y=e^{2x}-e^{x}$, so $y(\\ln2)=4-2=2$.'},
{s:'C',t:'NAT',m:2,q:'The value of $\\dfrac{1}{2\\pi i}\\displaystyle\\oint_{|z|=2}\\dfrac{e^{z}}{z(z-1)}\\,dz$ is ______ (rounded to two decimal places).',a:[1.71,1.72],e:'Residue at $0$ is $-1$, at $1$ is $e$. Sum $=e-1\\approx1.72$.'}
];
/* ===== Engine ===== */
const $=s=>document.querySelector(s),app=$('#app'),LET='ABCD',f=n=>String(n).padStart(2,'0');
let S,endT,tm,nm='';
const has=i=>Q[i].t=='NAT'?S.ans[i]!=='':S.ans[i].length>0;
const mk=i=>S.st[i]==3||S.st[i]==4;
const pen=q=>q.t=='MCQ'?'Negative −'+(q.m/3).toFixed(2):'No negative';
const mth=()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
const CL=['nv','n','a','m','am'];
const leg=`<div class=leg><span><i>1</i>Not Visited</span><span><i class=n>2</i>Not Answered</span><span><i class=a>3</i>Answered</span><span><i class=m>4</i>Marked for Review</span><span style="grid-column:span 2"><i class=am>5</i>Answered &amp; Marked for Review (will be evaluated)</span></div>`;
function intro(){
 const tot=Q.reduce((a,q)=>a+q.m,0);
 app.innerHTML=`<div class=card><h2>${CFG.title}</h2><p>Total Questions: <b>${Q.length}</b> &nbsp;·&nbsp; Maximum Marks: <b>${tot}</b> &nbsp;·&nbsp; Duration: <b>${CFG.minutes} minutes</b></p>
 <h3>Instructions &amp; Marking Scheme (IIT JAM pattern)</h3><ul>
 <li><b>Section A – MCQ:</b> one correct option. 1-mark question: −1/3 for a wrong answer. 2-mark question: −2/3 for a wrong answer.</li>
 <li><b>Section B – MSQ:</b> one or more correct options. Full marks only if <i>all</i> correct options (and no wrong option) are selected. No negative marking and no partial marking.</li>
 <li><b>Section C – NAT:</b> type the numerical answer using the on-screen keypad. No negative marking.</li>
 <li>Unattempted questions carry zero marks. The test auto-submits when the timer ends.</li>
 <li>Questions "Marked for Review" with an answer are evaluated; without an answer they are treated as unattempted.</li></ul>${leg}
 <p>Candidate name: <input type=text id=nm placeholder="Your name"></p>
 <label><input type=checkbox id=ag> I have read and understood the instructions.</label><br><br><button class=go id=gb disabled>Start Test</button></div>`;
 $('#ag').onchange=e=>$('#gb').disabled=!e.target.checked;
 $('#gb').onclick=()=>{nm=$('#nm').value.trim()||'Candidate';start()};
}
function start(){
 S={i:0,ans:Q.map(q=>q.t=='NAT'?'':[]),st:Q.map(()=>0)};S.st[0]=1;
 endT=Date.now()+CFG.minutes*60000;tm=setInterval(tick,500);tick();
 onbeforeunload=e=>{e.preventDefault();e.returnValue=''};$('#timer').style.display='block';draw();
}
function tick(){
 const r=Math.max(0,Math.ceil((endT-Date.now())/1000));
 $('#timer').textContent='Time Left: '+f(Math.floor(r/3600))+':'+f(Math.floor(r%3600/60))+':'+f(r%60);
 if(!r)finish();
}
function commit(i,m){S.st[i]=has(i)?(m?4:2):(m?3:1)}
function nav(n,m){commit(S.i,m);S.i=n;if(!S.st[n])S.st[n]=1;draw()}
function pick(j,c){const q=Q[S.i];if(q.t=='MCQ')S.ans[S.i]=[j];else{const a=S.ans[S.i];S.ans[S.i]=c?[...a,j]:a.filter(x=>x!=j)}}
function nat(v,inp){v=v.replace(/[^0-9.\-]/g,'');S.ans[S.i]=v;if(!inp)$('#nat').value=v}
function clr(){S.ans[S.i]=Q[S.i].t=='NAT'?'':[];S.st[S.i]=1;draw()}
function draw(){
 const q=Q[S.i],secs=[...new Set(Q.map(x=>x.s))];

function summary(){
 const secs=[...new Set(Q.map(x=>x.s))];commit(S.i,mk(S.i));
 const rows=secs.map(s=>{const ix=Q.map((_,i)=>i).filter(i=>Q[i].s==s),c=k=>ix.filter(i=>S.st[i]==k).length;
 return `<tr><td>${CFG.secs[s]}</td><td>${ix.length}</td><td>${c(2)+c(4)}</td><td>${c(1)+c(3)}</td><td>${c(3)+c(4)}</td><td>${c(0)}</td></tr>`}).join('');
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class=card><h3>Exam Summary</h3><table><tr><th>Section</th><th>Questions</th><th>Answered</th><th>Not Answered</th><th>Marked for Review</th><th>Not Visited</th></tr>${rows}</table><p>Are you sure you want to submit? You cannot change answers after submitting.</p><button class=btn onclick="this.closest('.ov').remove()">No, go back</button> <button class=go onclick="finish()">Yes, Submit</button></div>`;
 document.body.appendChild(o);
}
function score(i){
 const q=Q[i],a=S.ans[i];if(!has(i))return 0;
 if(q.t=='MCQ')return a[0]==q.a[0]?q.m:-q.m/3;
 if(q.t=='MSQ')return a.length==q.a.length&&a.every(x=>q.a.includes(x))?q.m:0;
 const v=parseFloat(a);return !isNaN(v)&&v>=q.a[0]-1e-6&&v<=q.a[1]+1e-6?q.m:0;
}
function finish(){
 clearInterval(tm);onbeforeunload=null;$('#timer').style.display='none';document.querySelectorAll('.ov').forEach(e=>e.remove());
 const sc=Q.map((_,i)=>score(i)),tot=Q.reduce((a,q)=>a+q.m,0),sum=sc.reduce((a,b)=>a+b,0);
 const att=Q.filter((_,i)=>has(i)).length,ok=sc.filter(x=>x>0).length,bad=sc.filter(x=>x<0).length;
 const secs=[...new Set(Q.map(x=>x.s))];
 const srows=secs.map(s=>{const ix=Q.map((_,i)=>i).filter(i=>Q[i].s==s);return `<tr><td>${CFG.secs[s]}</td><td>${(ix.reduce((a,i)=>a+sc[i],0)).toFixed(2)}</td><td>${ix.reduce((a,i)=>a+Q[i].m,0)}</td></tr>`}).join('');
 const ans=(q,a)=>q.t=='NAT'?(a===''?'—':a):(a.length?[...a].sort().map(j=>LET[j]).join(', '):'—');
 const rev=Q.map((q,i)=>{const correct=q.t=='NAT'?(q.a[0]==q.a[1]?q.a[0]:q.a[0]+' to '+q.a[1]):q.a.map(j=>LET[j]).join(', ');
 return `<div class="rv ${sc[i]>0?'ok':sc[i]<0||has(i)?'bad':''}"><b>Q${i+1}</b> · ${q.t} · <b>${sc[i]>0?'+':''}${+sc[i].toFixed(2)}</b> / ${q.m}<p>${q.q}</p>${q.o?'<ol type=A>'+q.o.map(o=>`<li>${o}</li>`).join('')+'</ol>':''}<p>Your answer: <b>${ans(q,S.ans[i])}</b> &nbsp;|&nbsp; Correct answer: <b>${correct}</b></p><p><i>Solution:</i> ${q.e}</p></div>`}).join('');
 app.innerHTML=`<div class=card><h2>Result — ${nm}</h2><div class=big>${sum.toFixed(2)} / ${tot}</div>
 <p>Attempted: <b>${att}</b> · Correct: <b>${ok}</b> · Wrong: <b>${bad}</b> · Not attempted: <b>${Q.length-att}</b> · Accuracy: <b>${att?Math.round(ok/att*100):0}%</b></p>
 <table><tr><th>Section</th><th>Score</th><th>Max</th></tr>${srows}</table>
 <button class="btn pri" onclick="location.reload()">Retake Test</button> <a class=btn href="index.html" style="text-decoration:none;color:#000;display:inline-block">Back to Emerging Sciences</a>

}
