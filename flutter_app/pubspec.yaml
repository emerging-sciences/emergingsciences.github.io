publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  google_sign_in: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
